name: Fork Sanitizer Repro

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  fork-repro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y clang binutils gcc

      - name: Run repro
        run: |
          echo "clang baseline"
          clang -g -o forktest forktest.c ../plthook_elf.c -ldl
          readelf -r forktest | grep -i fork || echo "(no fork reloc)"
          ./forktest

          echo "clang + asan"
          clang -g -fsanitize=address -o forktest_asan forktest.c ../plthook_elf.c -ldl
          readelf -r forktest_asan | grep -i fork || echo "(no fork reloc)"
          ./forktest_asan || true

          echo "clang + tsan"
          clang -g -fsanitize=thread -o forktest_tsan forktest.c ../plthook_elf.c -ldl
          readelf -r forktest_tsan | grep -i fork || echo "(no fork reloc)"
          nm -D forktest_tsan | grep -i fork || true
          nm forktest_tsan | grep -i fork || true
          objdump -d forktest_tsan | grep -A5 -B5 -i fork || true
          ./forktest_tsan || true

          echo "gcc + asan"
          gcc -g -fsanitize=address -o forktest_gcc_asan forktest.c ../plthook_elf.c -ldl
          readelf -r forktest_gcc_asan | grep -i fork || echo "(no fork reloc)"
          nm -D forktest_gcc_asan | grep -i fork || true
          nm forktest_gcc_asan | grep -i fork || true
          objdump -d forktest_gcc_asan | grep -A5 -B5 -i fork || true
          ./forktest_gcc_asan || true

          echo "gcc + tsan"
          gcc -g -fsanitize=thread -o forktest_gcc_tsan forktest.c ../plthook_elf.c -ldl
          readelf -r forktest_gcc_tsan | grep -i fork || echo "(no fork reloc)"
          nm -D forktest_gcc_tsan | grep -i fork || true
          nm forktest_gcc_tsan | grep -i fork || true
          objdump -d forktest_gcc_tsan | grep -A5 -B5 -i fork || true
          ./forktest_gcc_tsan || true
