name: Haiku Tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - haiku-support

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests_on_haiku:
    name: Tests on Haiku
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimization: ["", "-O2", "-O3"]

    steps:
      - uses: actions/checkout@v4

      - name: Test on Haiku
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: haiku
          version: r1beta5
          architecture: x86-64
          shell: sh
          run: |
            export OPT_CFLAGS="${{ matrix.optimization }} -DPLTHOOK_DEBUG"
            cd test && make clean libtest.so testprog
            echo "=== testprog ELF info ==="
            readelf -h testprog
            readelf -l testprog
            readelf -d testprog
            echo "=== libtest.so ELF info ==="
            readelf -d libtest.so
            echo "=== check libm ==="
            ls -la /boot/system/lib/libm* 2>/dev/null || echo "no libm in system lib"
            echo "=== run testprog ==="
            LIBRARY_PATH="$(pwd)" ./testprog open 2>&1 || echo "exit code: $?"
